name: Release Hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch base branch
        run: |
          git fetch "${{ github.event.pull_request.base.repo.clone_url }}" \
            "${{ github.event.pull_request.base.ref }}:refs/remotes/base/${{ github.event.pull_request.base.ref }}" \
            --depth=1

      - name: Resolve bump type
        id: bump
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # A release:* label wins. Otherwise the bump comes from the PR
          # title's conventional-commit prefix (feat: minor, fix:/docs:/chore:
          # patch, "!" major); a title with no recognized prefix fails here.
          type=""
          for candidate in major minor patch none; do
            case " $LABELS " in *" release:$candidate "*) type="$candidate"; break;; esac
          done
          if [ -z "$type" ]; then
            type="$(python3 scripts/bump_version.py --print-bump --message "$PR_TITLE")"
          fi
          echo "type=$type" >> "$GITHUB_OUTPUT"
          echo "release bump: $type"

      - name: Label the PR with its release bump
        uses: actions/github-script@v7
        env:
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
        with:
          script: |
            // Every PR carries exactly one release:* label so the bump is
            // visible on the PR itself. Changing the label changes the bump.
            const wanted = `release:${process.env.BUMP_TYPE}`;
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const current = context.payload.pull_request.labels.map(label => label.name);
            const stale = current.filter(name => name.startsWith("release:") && name !== wanted);
            for (const name of stale) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name });
            }
            if (current.includes(wanted)) return;
            try {
              await github.rest.issues.getLabel({ owner, repo, name: wanted });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner, repo, name: wanted, color: "ededed",
                description: `Release hygiene: ${process.env.BUMP_TYPE} bump`,
              });
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [wanted] });

      - name: Bump release metadata
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
          BASE_REF: refs/remotes/base/${{ github.event.pull_request.base.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 scripts/bump_version.py \
            --bump "$BUMP_TYPE" \
            --base-ref "$BASE_REF" \
            --message "$PR_TITLE"

      - name: Commit generated release metadata
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- package.json .claude-plugin/plugin.json .claude-plugin/marketplace.json .codex-plugin/plugin.json CHANGELOG.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json .claude-plugin/plugin.json .claude-plugin/marketplace.json .codex-plugin/plugin.json CHANGELOG.md
          git commit -m "chore: update release metadata"
          git push

      - name: Verify release hygiene
        env:
          BASE_REF: refs/remotes/base/${{ github.event.pull_request.base.ref }}
        run: python3 scripts/check_release_hygiene.py --base-ref "$BASE_REF"
